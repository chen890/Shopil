name: Update prices and deploy

on:
  schedule:
    # Every 2 hours. A full run takes ~30 minutes; chains republish full
    # price files a few times a day, so this keeps prices close to live
    # without hammering their servers.
    - cron: "20 */2 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # commit the geocode cache
  pages: write
  id-token: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Fetch and build price data
        env:
          PREVIOUS_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          RAW_DIR: ${{ runner.temp }}/raw
        run: python pipeline/run_all.py site/data

      - name: Save new geocoding results
        run: |
          if ! git diff --quiet pipeline/geocode_cache.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pipeline/geocode_cache.json
            git commit -m "Update geocode cache [skip ci]"
            git push || echo "push skipped"
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
